# dbsync configuration. Copy to config.toml and edit.

# The local directory kept in sync. Created if missing.
local_root = "/data/storage/dbsync"

# The Dropbox-side folder to mirror. "" means the app's root.
remote_root = ""

# Dropbox app key, from https://www.dropbox.com/developers/apps
# Only the key is needed — dbsync uses OAuth2 PKCE, so no app secret is stored.
app_key = "your-app-key-here"

[longpoll]
# Seconds the long-poll request is allowed to block before returning
# `changes: false`. Dropbox permits 30-480.
timeout_secs = 300

[watcher]
# How long local filesystem events are coalesced before an upload is attempted.
debounce_ms = 500

[download]
# How many bytes of downloads may be in flight at once. Downloads are admitted
# by size, not by file count, so many small files overlap freely while one huge
# file runs alone. Lower this on a slow or metered link.
budget_bytes = 67108864

# Downloads admitted regardless of the byte budget, so one enormous file cannot
# serialise the small files queued behind it. Must be at least 1.
min_concurrency = 4

# Hard cap on downloads in flight, however small the files. Raise it for an
# account of many tiny files on a fast link; past ~16 the extra sockets tend to
# buy throughput back in rate limits. Must be at least min_concurrency.
max_concurrency = 16

# Files at least this large are fetched as several byte ranges at once, rather
# than on one stream. Below it the extra round trips cost more than the
# parallelism saves. Must be at least chunk_size.
chunk_min_size = 8388608

# The nominal size of each range. Smaller chunks refetch more cheaply after an
# error; larger ones spend less time on round trips. Must be at least 1.
chunk_size = 8388608

# The most ranges one file is ever split into. Past this the chunk size grows
# instead of the count, so a very large file stays a manageable plan. Must be
# at least 1.
max_chunks = 64

# The most ranges of a *single* file in flight at once. A file may only spend
# the bytes its own admission reserved, so this is a ceiling rather than a
# target: it never multiplies with max_concurrency. Must be at least 1.
chunk_concurrency = 8
