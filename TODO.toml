schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work as a new task rather than losing it."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `scripts/todo.sh done <id>` to move it to FINISHED.toml."
scope = "In bounds: a Linux Dropbox sync daemon driven by the long-poll notification endpoint. Out of bounds: webhooks or any publicly reachable server component, a GUI, and providers other than Dropbox."

[[task]]
id = "sweep-orphaned-dbsync-partial-files"
title = "Sweep orphaned .dbsync-partial files"
description = "download_to removes its partial file when a download errors, but a hard kill leaves it on disk forever. Nothing ever sweeps them, so they accumulate silently in the synced tree — invisible to sync (the watcher filters them via is_partial) but real bytes. Add a cleanup pass, most naturally at startup before the initial pull."
status = "active"
level = "task"
category = "bug"
urgency = "low"
order = 20
created = 2026-08-29
tags = ["sync"]

[[task]]
id = "resume-an-interrupted-download-with-a-range-request"
title = "Resume an interrupted download with a Range request"
description = "download_to deletes its partial file on error and re-fetches from byte zero next time. For a large file on a flaky link that can mean never finishing. Keep the partial and re-request with an HTTP Range header, validating the remote rev is unchanged before trusting the prefix."
status = "active"
level = "task"
category = "feature"
urgency = "low"
order = 30
created = 2026-08-29
tags = ["sync"]
