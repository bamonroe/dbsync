[[task]]
id = "document-ranged-chunked-downloads-in-the-architecture-doc"
title = "Document ranged chunked downloads in the architecture doc"
description = "docs/architecture.md owns how the data path works and records the load-bearing decisions, so the chunking design belongs there and nowhere else: why chunks address rev:<rev> rather than the display path, why progress moved from a file length to a sidecar bitmap, why completion is 'every chunk present', and how per-file chunk concurrency composes with the across-file byte budget instead of multiplying it. Link it from the download section rather than restating the config keys README.md owns."
status = "active"
