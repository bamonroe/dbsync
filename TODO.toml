[[task]]
id = "resume-an-interrupted-initial-pull-instead-of-re-listing"
title = "Resume an interrupted initial pull instead of re-listing"
description = "The cursor is persisted before any file entries are, so a first pull that is killed part-way leaves state.json holding a valid cursor with entries={}. That is indistinguishable from a fresh start, so the next run does a full re-list and re-downloads everything. Observed live: the initial pull was interrupted twice and re-listed from scratch both times. Harmless on a small account, expensive on a large one. Fix so an interrupted pull resumes from what it already has."
status = "active"
level = "task"
category = "bug"
urgency = "normal"
order = 10
created = 2026-08-29
tags = ["sync", "state"]
