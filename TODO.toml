description = "Follow the pattern src/config.rs already uses for min_concurrency / max_concurrency, including the environment-variable override at src/config.rs:163 and the validation at :201. Needs at minimum a minimum-size threshold below which a file is fetched whole, a chunk size, and a per-file chunk concurrency. Validate the same way the existing pair does (a zero chunk size, a threshold below the chunk size). Document every new key in README.md in the same commit."
