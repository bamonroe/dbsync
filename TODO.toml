[[task]]
id = "whole-file-download-resume-can-splice-zero-filled-tail-after-a-crash"
title = "Whole-file download resume can splice zero-filled tail after a crash"
description = "src/api/download.rs:81-113,245-250: the single-stream path never fsyncs until the body ends, so after power loss the partial's length can exceed its durable content (ext4 zero-fills); the next attempt resumes at existing_len and appends, producing a corrupt middle that gets renamed into place and recorded as correct. Fsync periodically like the chunked path does, or verify the content hash before rename (see the verify-download task)."
status = "active"
level = "task"
category = "bug"
urgency = "high"
order = 50
created = 2026-08-30
