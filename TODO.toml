tags = ["review"]

[[task]]
id = "startup-sweep-deletes-all-partials-defeating-cross-restart-download-resume"
title = "Startup sweep deletes all partials, defeating cross-restart download resume"
description = "src/reconcile/sweep.rs:21 vs src/api/download.rs:50-53: download_to's contract keeps partials so the next attempt resumes, and ChunkMap survives reopen — but the startup sweep unconditionally removes every .dbsync-partial* file, so an interrupted large download restarts from byte zero after any daemon restart. Only sweep partials that no longer correspond to a pending download (or age them out)."
status = "active"
level = "task"
category = "bug"
urgency = "normal"
order = 100
created = 2026-08-30
tags = ["review"]

