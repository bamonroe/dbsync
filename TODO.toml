# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work as a new task rather than losing it."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `scripts/todo.sh done <id>` to move it to FINISHED.toml."
scope = "In bounds: a Linux Dropbox sync daemon driven by the long-poll notification endpoint. Out of bounds: webhooks or any publicly reachable server component, a GUI, and providers other than Dropbox."

[[task]]
id = "new-files-created-under-a-shortened-path-upload-to-the-wrong-remote-path"
title = "New files created under a shortened path upload to the wrong remote path"
description = "src/reconcile/local.rs:41-48 + src/reconcile/paths.rs:97-112: aliases are recorded per applied entry only, so a user file created inside a locally-shortened folder (longname~a1b2c3d4/) has no alias and to_remote emits the fingerprint-mangled name, creating a duplicate remote folder tree. Resolve parent-directory aliases when mapping local paths to remote."
status = "active"
level = "task"
category = "bug"
urgency = "normal"
order = 80
