id = "avoid-redundant-token-refreshes-after-parallel-401s"
title = "Avoid redundant token refreshes after parallel 401s"
description = "src/auth/provider.rs:66-70: force_refresh unconditionally clears the cache, so N parallel downloads that all hit a 401 trigger N serialized token-endpoint calls. Pass in the token that failed and skip the refresh if the cache already holds a newer one."
