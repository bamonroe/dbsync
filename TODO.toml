[[task]]
id = "download-files-in-parallel-under-a-byte-budget"
title = "Download files in parallel under a byte budget"
description = """
Downloads are strictly sequential today: apply_page awaits apply_entry per entry in a loop (src/reconcile/apply.rs:186) with no spawn/join/buffer_unordered anywhere in the apply path. Measured live at ~2.0 MiB/s and 28 files/min, which is one HTTPS stream's throughput plus a full round-trip of latency before each file's first byte -- not the link's capacity.

Bound BYTES in flight, not file count. A plain file-count semaphore is the wrong knob: eight 1 GB files at once thrashes the disk and stalls every small file behind them, while eight 4 KB files leaves the link idle. Instead give each download a cost equal to its size and admit against a byte budget (~64 MB to start). list_folder already returns 'size' on every file entry, so the cost is known up front -- no guessing.

  - a hundred files totaling 1 MB: all hundred admitted at once, a rounding error against the budget
  - one 1 GB file: admitted alone, occupying the budget by itself, which is fine since a single big stream can already saturate the link

Pair the budget with a floor and a ceiling on file count: a minimum concurrency (2-4) so one huge file does not serialize everything behind it forever, and a maximum (~16) so ten thousand 1 KB files do not open ten thousand sockets. Clamp each file's cost to the whole budget so an oversized file counts as the full budget rather than being unschedulable.

Two existing invariants collide with out-of-order completion and are the real work here:

  1. Checkpoint ordering (commit 290d540). 'Apply before advance' currently holds trivially because entries complete in order. With parallel completion a page's cursor may only advance once EVERY entry in that page has landed, or a crash resumes past a file that never finished. The interim per-file state saves already leave the cursor alone, so this is survivable -- but a page's slowest file then gates the whole page's advance.

  2. Path-level races. A page can hold a delete and a create for the same path, or a folder tombstone whose handler removes children another task is concurrently writing. Shard by path (hash the path to a lane so same-path operations stay sequential) and keep deletes and folder tombstones on a serial track outside the parallel pool.

Level is scope: investigate the apply path and the cursor/checkpoint interaction first, then break out the atomic tasks. Follow-on idea, deliberately NOT part of this item: parallel ranged chunks within a single large file, which the Range/rev:<rev> support from e18cc0e already lays the groundwork for."""
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
order = 40
created = 2026-08-29
tags = ["download", "performance"]

[[task]]
id = "fetch-one-large-file-as-parallel-ranged-chunks"
title = "Fetch one large file as parallel ranged chunks"
description = """
Parallelism ACROSS files does nothing for a single huge file: one 1 GB download is still one HTTPS stream at ~2 MiB/s no matter how large the byte budget is. This is the complementary half of [download-files-in-parallel-under-a-byte-budget] -- split one file into N byte ranges and fetch them concurrently into the same partial.

Most of the groundwork already exists from e18cc0e:
  - send_download / content_download_from already take resume_from and set the RANGE header, so issuing an arbitrary range is a parameter change rather than new transport code
  - the resumed request already addresses 'rev:<rev>' instead of the display path, which is what makes concurrent chunks provably come from ONE revision. Without that, a remote edit mid-download would splice two revisions into a single file and the result would be silent corruption rather than a visible failure.
  - partial_path already keys the partial file by sanitised rev, so a mid-download remote edit starts a fresh partial and the stale one is cleared by the startup sweep (src/reconcile/sweep.rs)

The actual work is bookkeeping. Today a partial's progress IS its length: existing_len() stats the file and resumes from there. That single number cannot express 'ranges 0-3 and 5 landed, 4 did not', so concurrent chunks need a real record of which ranges have been written. Options to weigh during the investigation:

  - a sidecar index file next to the partial, which must be updated durably as each chunk lands or a crash loses the map and forces a restart from zero
  - fixed-size chunks so the map is a compact bitmap and chunk N's offset is implied rather than stored
  - write chunks at their true offsets into a sparse preallocated file, so the file is correct by construction once every chunk is accounted for

Whichever is chosen, the completion test must become 'every range present' rather than 'length equals size' -- a sparse file reaches full length as soon as the LAST chunk lands, so length alone would declare a half-downloaded file complete and rename a hole-filled file into place.

Also decide: a size threshold below which chunking is pointless (a 200 KB file split four ways just pays four round-trips), how chunk concurrency composes with the outer byte budget so the two do not multiply into far more sockets than intended, and whether 416 / non-206 handling per chunk should fail the whole file or just retry that range.

Level is scope: investigate src/api/download.rs and the partial-file representation, then break out the atomic tasks."""
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
order = 50
created = 2026-08-29
tags = ["download", "performance"]
