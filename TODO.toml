[[task]]
id = "plan-a-file-s-chunk-layout-from-its-size"
title = "Plan a file's chunk layout from its size"
description = "A pure module that turns (size, config) into the list of byte ranges to fetch, with no network or disk in it -- the same shape as src/reconcile/budget.rs, and testable the same way. Fixed-size chunks, so chunk N's offset is implied by N and the progress map can be a bitmap rather than a stored list of extents. Below a threshold size it must yield exactly one whole-file range, so a 200 KB file keeps its single request instead of paying four round-trips. Cover: size zero, size below the threshold, size exactly one chunk, a size with a short final chunk, and a cap on chunks per file so a huge file does not produce thousands of ranges."
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 80
created = 2026-08-29
tags = []

[[task]]
id = "record-chunk-progress-in-a-sidecar-bitmap-beside-the-partial"
title = "Record chunk progress in a sidecar bitmap beside the partial"
description = "Today a partial's progress IS its length (existing_len, src/api/download.rs:99), which cannot express 'chunks 0-3 and 5 landed, 4 did not'. Write chunks at their true offsets into a sparse partial and keep a sidecar bitmap file, one bit per fixed-size chunk, named off partial_path so the startup sweep in src/reconcile/sweep.rs clears it with the partial it belongs to. The sidecar header must carry the size and chunk size, and a mismatch against the expected values must be treated as an unusable map and restart from zero. Each landed chunk sets its bit and fsyncs the sidecar before it counts -- a crash may lose progress but must never claim a chunk that is not on disk. Test round-tripping the map, rejecting a mismatched header, and rejecting a truncated sidecar."
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 90
created = 2026-08-29
tags = []

[[task]]
id = "complete-a-chunked-download-on-every-chunk-present-never-on-length"
title = "Complete a chunked download on 'every chunk present', never on length"
description = "A sparse file reaches its full length the moment the LAST chunk lands, so the current 'length equals size' test would rename a hole-filled file into place -- silent corruption. The rename in download_to must be gated on every bit in the sidecar map being set, and the sidecar removed only after the rename succeeds. Add a test that writes the final chunk first and asserts nothing is renamed, and one that fills every chunk out of order and asserts the destination bytes are exactly right."
status = "active"
level = "task"
category = "feature"
urgency = "high"
order = 100
created = 2026-08-29
tags = []

[[task]]
id = "fetch-a-file-s-chunks-concurrently-without-multiplying-the-socket-count"
title = "Fetch a file's chunks concurrently without multiplying the socket count"
description = "Drive the planned ranges concurrently into the one partial, all addressing 'rev:<rev>' so every chunk provably comes from a single revision. Chunk concurrency must draw from the SAME admission in src/reconcile/budget.rs that bounds across-file parallelism, not a second independent pool, or the two limits multiply into far more sockets than either intends -- a file admitted for its whole size should be spending that admission on its own chunks. Decide and document how a chunk's share is accounted against the byte budget. Per-chunk failure retries just that range and leaves the other bits set; a 416 or a non-206 on a chunk invalidates the map and restarts the file rather than failing the sync."
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 110
created = 2026-08-29
tags = []

[[task]]
id = "expose-the-chunking-threshold-and-per-file-chunk-concurrency-as-config"
title = "Expose the chunking threshold and per-file chunk concurrency as config"
description = "Follow the pattern src/config.rs already uses for min_concurrency / max_concurrency, including the environment-variable override at src/config.rs:163 and the validation at :201. Needs at minimum a minimum-size threshold below which a file is fetched whole, a chunk size, and a per-file chunk concurrency. Validate the same way the existing pair does (a zero chunk size, a threshold below the chunk size). Document every new key in README.md in the same commit."
status = "active"
level = "task"
category = "feature"
urgency = "low"
order = 120
created = 2026-08-29
