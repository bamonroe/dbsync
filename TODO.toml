title = "Buffer download writes and keep the partial file open across chunks"
description = "src/api/download.rs:263-267 (stream_to) and src/api/partial.rs:87-92 write each ~8-16 KB network frame straight to tokio::fs::File — wrap in BufWriter::with_capacity(256KiB) and flush before sync_all (~16x fewer dispatches). Also partial.rs:77-84 re-opens the file per chunk (up to 64 opens x retries); keep one open handle and use positional writes (FileExt::write_all_at), which also removes the shared-cursor hazard noted at line 26."
