# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work as a new task rather than losing it."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `scripts/todo.sh done <id>` to move it to FINISHED.toml."
scope = "In bounds: a Linux Dropbox sync daemon driven by the long-poll notification endpoint. Out of bounds: webhooks or any publicly reachable server component, a GUI, and providers other than Dropbox."

[[task]]
id = "guard-against-local-edits-landing-during-a-download"
title = "Guard against local edits landing during a download"
description = "src/reconcile/apply.rs:127,149-167,193: has_local_edit runs in decide(), but a long chunked download then ends with a rename over dest — a user edit in that window is clobbered with no conflicted copy. Also record() hashes the file after the rename, so an edit between rename and record is stamped as the remote rev and never uploaded. Re-check divergence just before the rename, and hash the downloaded temp file (or use the known content hash) rather than the renamed dest."
status = "active"
level = "task"
category = "bug"
urgency = "high"
order = 30
created = 2026-08-30
tags = ["review"]

[[task]]
id = "drop-vanished-must-preserve-locally-edited-files"
title = "drop_vanished must preserve locally-edited files"
description = "src/reconcile/mod.rs:416-434: on resync, any tracked path absent from the full listing is remove_file'd unconditionally — a never-uploaded local edit is destroyed. The download path preserves diverged files via conflict::preserve; apply the same divergence check here. Also (mod.rs:426-429) one failed delete (e.g. EISDIR) aborts the whole pass after the cursor was already persisted, leaving the remaining vanished files permanently undeleted — record failures and continue instead."
