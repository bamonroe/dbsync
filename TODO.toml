[[task]]
id = "watcher-filter-misses-state-journal-causing-a-self-feeding-sync-loop"
title = "Watcher filter misses state.journal, causing a self-feeding sync loop"
description = "src/watcher/mod.rs:110-114: is_state_file matches only names starting state.json, but StateDb also writes state.journal (journal.rs:71). With the state db inside the synced folder, every save triggers a watcher event, a push, another save, another journal write — an endless upload loop. Also the name-only filter means any user file named state.json* anywhere is silently never synced. Filter by the actual configured state-db paths instead of names."
status = "active"
level = "task"
category = "bug"
urgency = "high"
