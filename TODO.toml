scope = "In bounds: a Linux Dropbox sync daemon driven by the long-poll notification endpoint. Out of bounds: webhooks or any publicly reachable server component, a GUI, and providers other than Dropbox."

[[task]]
id = "persist-sync-state-incrementally-instead-of-rewriting-the-whole-file"
title = "Persist sync state incrementally instead of rewriting the whole file"
description = "StateDb::save serializes and writes every tracked entry on each call, which is what makes mid-page checkpointing expensive. An append-only journal or a keyed store would make a checkpoint cost the size of the change rather than the size of the account, removing the O(n^2) shape at its root rather than tuning around it."
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
order = 20
created = 2026-08-29
tags = ["state", "performance"]

[[task]]
id = "handle-remote-paths-whose-filename-exceeds-the-local-filesystem-limit"
title = "Handle remote paths whose filename exceeds the local filesystem limit"
description = "Three real files fail permanently with ENAMETOOLONG (os error 36) because the Dropbox name is longer than the 255-byte limit for one path component. They are recorded as permanent failures and never retried, which is correct but leaves the file absent. Shorten the component deterministically (truncate plus a short hash of the full name, keeping the extension) and record the mapping in the state so the local-to-remote direction still recognises it."
status = "active"
level = "task"
category = "bug"
urgency = "normal"
order = 50
created = 2026-08-30
tags = []
