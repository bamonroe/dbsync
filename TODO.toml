[[task]]
id = "persist-sync-state-incrementally-instead-of-rewriting-the-whole-file"
title = "Persist sync state incrementally instead of rewriting the whole file"
description = "StateDb::save serializes and writes every tracked entry on each call, which is what makes mid-page checkpointing expensive. An append-only journal or a keyed store would make a checkpoint cost the size of the change rather than the size of the account, removing the O(n^2) shape at its root rather than tuning around it."
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
order = 20
created = 2026-08-29
tags = ["state", "performance"]

[[task]]
id = "give-dbsync-failures-a-way-to-retry-one-path-on-demand"
title = "Give dbsync failures a way to retry one path on demand"
description = "The retry pass runs on a pull. An operator who has just fixed the cause (renamed a long filename, freed disk) has no way to say 'try this one now' short of waiting for the next pull or forcing a re-list by clearing the cursor."
status = "active"
level = "task"
category = "feature"
urgency = "normal"
order = 30
created = 2026-08-30
tags = ["cli"]

[[task]]
id = "record-failures-for-the-local-to-remote-direction-too"
title = "Record failures for the local-to-remote direction too"
description = "Reconciler::push logs and steps over a failing path exactly as the pull path used to, so a file that fails to upload is silently un-synced with no record. The failure store is direction-agnostic; the push path just does not write to it yet."
status = "active"
level = "task"
category = "bug"
urgency = "normal"
order = 40
created = 2026-08-30
tags = ["reconcile"]
