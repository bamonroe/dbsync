[package]
name = "dbsync"
version = "0.1.0"
edition = "2024"
description = "Realtime Dropbox sync daemon for Linux, driven by long-poll notifications"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "signal", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
directories = "5"

# Renamed: the fs-watch crate is `notify`, which would collide with our own
# `crate::notify` module (the Dropbox long-poll loop).
notify_fs = { package = "notify", version = "6" }
base64 = "0.22"
getrandom = "0.3"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
http = "1"
