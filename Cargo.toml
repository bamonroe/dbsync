[package]
name = "dbsync"
version = "0.1.0"
edition = "2024"
description = "Realtime Dropbox sync daemon for Linux, driven by long-poll notifications"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "signal", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only ever parsed here (config load); the serializer is pulled in by the
# drift test alone, via dev-dependencies.
toml = { version = "0.8", default-features = false, features = ["parse"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
# Reference-counted buffers: an upload body is cloned for the 401-retry path,
# and a chunk can be 8 MiB.
bytes = "1"
hex = "0.4"
directories = "5"

# Renamed: the fs-watch crate is `notify`, which would collide with our own
# `crate::notify` module (the Dropbox long-poll loop).
notify_fs = { package = "notify", version = "6" }
base64 = "0.22"
getrandom = "0.3"
urlencoding = "2"
# For `join_all` and `buffer_unordered`: both the parallel download track and a
# single file's parallel chunks drive futures that borrow their caller, so
# tokio's fixed-arity `join!` and its 'static `JoinSet` do not fit.
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
http = "1"
# `config_drift` re-serializes a Config to enumerate its keys.
toml = { version = "0.8", features = ["display"] }

# Link-time optimization across crates; "thin" keeps the release build fast
# enough to run routinely.
[profile.release]
lto = "thin"

# Line tables are enough for a backtrace, and are far cheaper to emit and link
# than full debug info.
[profile.dev]
debug = "line-tables-only"

# Dependencies are compiled once and then reused, so optimizing them pays for
# itself in test and daemon runtime without slowing the edit loop.
[profile.dev.package."*"]
opt-level = 2
